openapi: 3.0.3
info:
  title: Till
  version: 1.0.0
  description: |
    POS ledger and inventory API for one merchant with many outlets.
    Money is integer kobo (NGN). Stock quantities are integers.
    A cash sale deducts stock and posts a balanced journal in one Postgres transaction.
    A transfer, card, tap, USSD, QR or mobile money sale reserves stock until a signed payment event from a payment connection posts the sale.
    Payments are provider-neutral: Paystack, Flutterwave, Monnify and the standard `till` format are adapters behind POST /v1/webhooks/{connection_id}.
    A wallet sale spends store credit held as a liability of this merchant. It is not a licensed e-money wallet.
    Average cost, cost of goods, and an order-level discount are part of that same transaction.
    There is no public registration. Staff log in with a role of admin, manager, or cashier.

servers:
  - url: http://127.0.0.1:8080

tags:
  - name: Auth
  - name: Outlets
  - name: Products
  - name: Stock
  - name: Customers
  - name: Orders
  - name: Merchant
  - name: Payments
  - name: Payment connections
  - name: Unmatched payments
  - name: Reports
  - name: Audit
  - name: Staff
  - name: ApiKeys
  - name: Ops
  - name: Ledger
  - name: Shifts
  - name: Events
  - name: Suppliers

paths:
  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in a staff member
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Bearer token. Lifetime is TILL_TOKEN_TTL (default 8h). It carries jti and a per-staff token version, so logout or a password change revokes it.
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at, staff]
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
                  staff: { $ref: "#/components/schemas/Staff" }
        "401":
          $ref: "#/components/responses/Error"
        "429":
          description: rate_limited (per IP or per email) or account_locked (10 failures in 15 minutes). Retry-After is set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/me:
    get:
      tags: [Auth]
      summary: Current staff
      operationId: me
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Staff row. Password hash is never returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  staff: { $ref: "#/components/schemas/Staff" }
        "401":
          $ref: "#/components/responses/Error"

  /v1/outlets:
    get:
      tags: [Outlets]
      summary: List outlets the caller can use
      operationId: listOutlets
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Admin sees every outlet of the merchant. Others see assigned outlets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  outlets:
                    type: array
                    items: { $ref: "#/components/schemas/Outlet" }
    post:
      tags: [Outlets]
      summary: Open an outlet and its cash and sales accounts
      description: Admin only. Creates accounts `1000-{CODE}` and `4000-{CODE}`.
      operationId: createOutlet
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code]
              additionalProperties: false
              properties:
                name: { type: string, example: Ikeja }
                code:
                  type: string
                  pattern: "^[A-Z0-9]{2,8}$"
                  example: IKJ
      responses:
        "201":
          description: Outlet created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Outlet" }
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          description: code_taken
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/products:
    get:
      tags: [Products]
      summary: List the merchant catalog
      operationId: listProducts
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
    post:
      tags: [Products]
      summary: Create a product
      description: Admin only (a manager gets 403, because a new product sets a price). price_minor is integer kobo. Unknown fields are rejected.
      operationId: createProduct
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, name, price_minor]
              additionalProperties: false
              properties:
                sku: { type: string, example: SERUM-C }
                name: { type: string }
                price_minor: { type: integer, minimum: 1, example: 850000 }
                avg_cost_minor: { type: integer, minimum: 0, description: Opening average cost in kobo. Omit or 0 leaves the layer at zero until a receipt sets it. }
                reorder_level: { type: integer, minimum: 0 }
                tax_class: { type: string, enum: [standard, exempt, zero], default: standard, description: Only standard lines carry VAT. }
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400":
          $ref: "#/components/responses/Error"
        "409":
          description: sku_taken
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/products/{id}:
    patch:
      tags: [Products]
      summary: Change name, price, average cost, reorder level, or active flag
      description: |
        Admin or manager. Only an admin may send price_minor, avg_cost_minor or tax_class (a manager gets 403). A price change writes audit action product.price_changed.
        Changing avg_cost_minor while units are on hand posts the difference to inventory (1200)
        and inventory adjustment (5200). An increase credits 5200, which is allowed to go negative.
        That journal is not a cash transfer. A refund does not recompute the average.
        Requires Idempotency-Key. The product row is locked inside the transaction and the patch is applied to the locked row.
      operationId: patchProduct
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
                price_minor: { type: integer, minimum: 1 }
                avg_cost_minor: { type: integer, minimum: 0 }
                reorder_level: { type: integer, minimum: 0 }
                tax_class: { type: string, enum: [standard, exempt, zero] }
                active: { type: boolean }
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
        "400":
          description: invalid_amount, invalid_order, idempotency_key_required, or idempotency_key_reserved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: idempotency_conflict or idempotency_in_progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/stock/receipts:
    post:
      tags: [Stock]
      summary: Receive units into an outlet
      description: |
        Admin or manager. Increases on_hand.
        unit_cost_minor is optional integer kobo. Omit it and the current average is used, with no journal when that average is 0.
        Explicit 0 pulls the weighted average down and books nothing.
        A positive booked cost debits inventory (1200) and credits goods received (2150). It does not take cash from the drawer.
        Requires Idempotency-Key, so a retried receipt cannot double the stock.
      operationId: receiveStock
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outlet_id, sku, qty]
              additionalProperties: false
              properties:
                outlet_id: { type: string, format: uuid }
                sku: { type: string }
                qty: { type: integer, minimum: 1 }
                unit_cost_minor: { type: integer, minimum: 0, description: Omit to keep the current average. Explicit 0 is allowed. }
                delta: { type: integer, description: Not used on a receipt. }
                reason: { type: string }
                supplier_id: { type: string, format: uuid, description: Links the receipt to a supplier. Receipts only. }
      responses:
        "200":
          description: New on_hand
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockMove" }
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/stock/adjustments:
    post:
      tags: [Stock]
      summary: Adjust on_hand by a signed delta
      description: |
        Admin or manager. reason is required. delta 0 is rejected. The result cannot pass below reserved or below zero.
        When the average cost is above zero, the same transaction debits or credits inventory at that average against account 5200.
        Requires Idempotency-Key.
      operationId: adjustStock
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outlet_id, sku, delta, reason]
              additionalProperties: false
              properties:
                outlet_id: { type: string, format: uuid }
                sku: { type: string }
                delta: { type: integer, example: -1 }
                reason: { type: string, example: damaged bottle }
                qty: { type: integer }
      responses:
        "200":
          description: New on_hand
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockMove" }
        "409":
          description: insufficient_stock
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/customers:
    get:
      tags: [Customers]
      summary: Search customers and their store-credit balances
      description: Cashiers must pass q (at least 3 characters, name or phone) and see the phone masked as 0803****567. Managers and admins see full numbers and may omit q.
      operationId: listCustomers
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: q, description: "Name substring or phone digits", schema: { type: string, minLength: 3 } }
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Customers, ordered by name
          content:
            application/json:
              schema:
                type: object
                properties:
                  customers:
                    type: array
                    items: { $ref: "#/components/schemas/Customer" }
    post:
      tags: [Customers]
      summary: Create a customer
      description: Any signed-in role, including a cashier. Phone is unique per merchant. This is store credit, not a bank account.
      operationId: createCustomer
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 80 }
                phone: { type: string, maxLength: 32, example: "08030001111", description: "Normalised to E.164 (+2348030001111). Invalid numbers are 400 invalid_phone." }
      responses:
        "201":
          description: Customer created with a zero balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "409":
          description: phone_taken
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/customers/{id}:
    get:
      tags: [Customers]
      summary: Get one customer
      operationId: getCustomer
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "404":
          $ref: "#/components/responses/Error"

  /v1/customers/{id}/topups:
    post:
      tags: [Customers]
      summary: Take cash and add store credit
      description: |
        Requires Idempotency-Key. Any signed-in role that can access the outlet.
        One transaction debits outlet cash, credits customer wallet (2200), and increases customers.balance_minor.
        The sum of those balances equals the wallet account.
      operationId: topUpCustomer
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outlet_id, amount_minor]
              additionalProperties: false
              properties:
                outlet_id: { type: string, format: uuid }
                amount_minor: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Updated customer plus journal_id
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Customer"
                  - type: object
                    properties:
                      journal_id: { type: string, format: uuid }
        "409":
          description: idempotency_conflict or idempotency_in_progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/orders:
    get:
      tags: [Orders]
      summary: List orders
      description: Admin may omit outlet_id. Manager and cashier must pass an outlet they can access.
      operationId: listOrders
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/outletId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - { in: query, name: status, schema: { type: string, enum: [pending_payment, paid, partially_refunded, refunded, expired, voided] } }
        - { in: query, name: reference, schema: { type: string } }
        - { in: query, name: customer_id, schema: { type: string, format: uuid } }
        - { in: query, name: from, description: "RFC 3339 or YYYY-MM-DD (Lagos time). created_at >= from.", schema: { type: string } }
        - { in: query, name: to, description: "RFC 3339 (exclusive) or YYYY-MM-DD (that whole day, Lagos time).", schema: { type: string } }
      responses:
        "200":
          description: Orders, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
    post:
      tags: [Orders]
      summary: Sell
      description: |
        Requires Idempotency-Key.
        Cash deducts on_hand and posts the sale journal. Response 201, status paid.
        An awaited method (transfer, card, tap, ussd, qr, mobile_money) increments reserved, sets status pending_payment, and posts nothing.
        Only a payment event on a payment connection pays it. See POST /v1/webhooks/{connection_id}.
        Wallet requires customer_id, spends store credit, and posts in the same transaction. The balance cannot go negative (409 insufficient_wallet).
        discount_minor is optional integer kobo. Omit it or send 0 for no discount. It must be less than the shelf total. VAT is calculated on the amount the customer pays. The client cannot send a price.
        When the average cost is above zero, the sale journal also debits cost of goods (5000) and credits inventory (1200). A discount does not reduce that cost.
        Unknown JSON fields are rejected.
      operationId: createOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outlet_id, lines]
              additionalProperties: false
              description: Give either payment_method or payments (split tender), not both.
              properties:
                outlet_id: { type: string, format: uuid }
                payment_method: { type: string, enum: [cash, wallet, transfer, card, tap, ussd, qr, mobile_money] }
                payments:
                  type: array
                  minItems: 1
                  maxItems: 3
                  description: |
                    Split tender: at most one cash, one wallet and one awaited tender, amounts adding up to the payable (else 400 tender_mismatch).
                    Cash and wallet only posts at once. With an awaited tender (transfer, card, tap, ussd, qr, mobile_money) the order is
                    pending_payment, cash and wallet are held in Deposits held 2400, and the payment event must be for the awaited amount only.
                  items:
                    type: object
                    required: [method, amount_minor]
                    additionalProperties: false
                    properties:
                      method: { type: string, enum: [cash, wallet, transfer, card, tap, ussd, qr, mobile_money] }
                      amount_minor: { type: integer, minimum: 1 }
                      customer_id: { type: string, format: uuid, description: Required on the wallet tender only }
                discount_reason: { type: string, maxLength: 200, description: Required when discount_minor > 0 (400 discount_reason_required). Over the role limit is 403 discount_limit. }
                customer_id: { type: string, format: uuid, description: Required for wallet. Must be omitted for cash and transfer. }
                discount_minor: { type: integer, minimum: 0, description: Order-level discount in kobo. Floats are rejected. }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sku, qty]
                    additionalProperties: false
                    properties:
                      sku: { type: string }
                      qty: { type: integer, minimum: 1 }
            example:
              outlet_id: 00000000-0000-7000-8000-000000000001
              payment_method: cash
              lines:
                - { sku: SERUM-C, qty: 1 }
      responses:
        "201":
          description: Order created, or the stored response for the same key and body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          $ref: "#/components/responses/Error"
        "403":
          description: outlet_forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Outlet is not in this merchant, or SKU is unknown
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: insufficient_stock, insufficient_wallet, idempotency_conflict, or idempotency_in_progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/orders/{id}:
    get:
      tags: [Orders]
      summary: Get one order
      operationId: getOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/orders/{id}/refund:
    post:
      tags: [Orders]
      summary: Refund a paid order, in whole or by line
      description: |
        Optional lines (product_id or sku, quantity) refund part of the order; no lines refunds everything left. Repeatable until
        refunded: status goes paid, partially_refunded, refunded. Discount and VAT are apportioned to lines at sale time. More units
        than are left is 409 refund_exceeds_order. refund_to (cash, wallet, transfer) sends all of it to one tender that still has
        enough (any of the order's methods); without it the money goes back to the original tender, pro rata across a split order. The response adds refund.
        Admin or manager. Restocks and reverses the sale journal in one transaction. A wallet sale also puts the paid amount back on the customer balance. The average cost is not recomputed.
        Requires Idempotency-Key. Body may be empty, {} or an object with an optional reason.
        The order records refund_journal_id, refunded_at, refunded_by and refund_reason.
        An awaited-method sale (transfer, card, tap and so on) credits Refunds payable 2310 instead of clearing and returns refund_record_id,
        an unmatched payment in refund_pending. Close it with POST /v1/unmatched-payments/{id}/refunded once the money has left the provider.
        If an account would go negative the answer is 409 refund_insufficient_funds, naming the account.
      operationId: refundOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 200 }
                refund_to: { type: string, enum: [cash, wallet, transfer, card, tap, ussd, qr, mobile_money] }
                lines:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      product_id: { type: string, format: uuid }
                      sku: { type: string }
                      quantity: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Order is partially_refunded or refunded; refund describes this refund
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "409":
          description: refund_insufficient_funds, already_reversed, idempotency_conflict, or idempotency_in_progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/orders/{id}/void:
    post:
      tags: [Orders]
      summary: Void a pending order
      description: |
        Cashier at the outlet, manager or admin. Requires Idempotency-Key. Only a pending_payment order: the reservation is
        released, held cash and wallet tenders are returned, status becomes voided and order.voided is audited.
        A payment arriving later goes to unmatched payments with reason order_voided.
      operationId: voidOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 200 }
      responses:
        "200":
          description: The voided order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          $ref: "#/components/responses/Error"

  /v1/merchant/settings:
    get:
      tags: [Merchant]
      summary: Discount limits and VAT settings
      description: Admin only.
      operationId: getSettings
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantSettings" }
    patch:
      tags: [Merchant]
      summary: Change discount limits and VAT settings
      description: Admin only. Applies to new orders. vat_registered false puts 0 VAT on every line.
      operationId: patchSettings
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                vat_registered: { type: boolean }
                vat_inclusive_bps: { type: integer, minimum: 0, maximum: 5000 }
                max_discount_bps_cashier: { type: integer, minimum: 0, maximum: 10000 }
                max_discount_bps_manager: { type: integer, minimum: 0, maximum: 10000 }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantSettings" }

  /v1/webhooks/{connection_id}:
    post:
      tags: [Payments]
      summary: Receive a payment event from a provider
      description: |
        No bearer token. The connection in the path picks the merchant, the provider adapter and the signing secret
        before the body is trusted. An unknown, disabled or badly signed request is always 401 and changes nothing.

        Adapters and the header each one verifies:
        - paystack: Paystack-Signature "t=<unix>,v1=<key id>:<hex>" (HMAC-SHA512 of "t.body", 5 minute tolerance),
          or the older x-paystack-signature (HMAC-SHA512 of the body). Amounts are kobo. Only charge.success is a payment.
        - till: Till-Signature "t=<unix>,v1=<hex HMAC-SHA256 of t.body>" (5 minute tolerance). Body is TillPayment.
        - flutterwave: verif-hash equal to the shared secret. charge.completed. Amounts are naira. Not checked against live
          documentation: confirm with a sandbox webhook before go-live.
        - monnify: monnify-signature (HMAC-SHA512 of the body). SUCCESSFUL_TRANSACTION. Amounts are naira. Not checked against
          live documentation: confirm with a sandbox webhook before go-live.

        Every payment takes one path. The event is recorded once per connection and event id; a repeat replays the first answer
        with Idempotent-Replayed true and posts nothing. The order is found by reference inside the merchant. With no usable reference,
        the single pending order waiting for exactly that amount is paid (at the connection's outlet when it has one); two candidates
        are not guessed. A payment that fits pays the order and the response is the Order. Anything that cannot be applied
        (no_matching_order, ambiguous_amount, order_expired, order_voided, order_already_paid, order_refunded, currency_mismatch,
        amount_mismatch) is posted Dr 1100-CODE clearing / Cr 2300 Payment suspense and opened as an unmatched payment: 200 with
        status unmatched. fee_minor is posted Dr 5100 Payment fees / Cr 1100-CODE. Status failed is ignored. Status reversed is only
        written to the audit log (payment.reversed) and posts nothing: chargeback handling is not built.
      operationId: paymentWebhook
      parameters:
        - in: path
          name: connection_id
          required: true
          schema: { type: string, format: uuid }
        - { in: header, name: Till-Signature, required: false, description: "Used by provider till.", schema: { type: string } }
        - { in: header, name: Paystack-Signature, required: false, description: "Used by provider paystack.", schema: { type: string } }
        - { in: header, name: x-paystack-signature, required: false, description: "Older Paystack header.", schema: { type: string } }
        - { in: header, name: verif-hash, required: false, description: "Used by provider flutterwave.", schema: { type: string } }
        - { in: header, name: monnify-signature, required: false, description: "Used by provider monnify.", schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/TillPayment"
                - type: object
                  description: The provider's own notification body.
                  additionalProperties: true
            example:
              id: tap-1001
              reference: IKJ-A1B2C3D4-000002
              amount_minor: 120000
              method: tap
      responses:
        "200":
          description: Paid order, an unmatched payment, an ignored event, or the stored answer to a repeated event
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Order"
                  - type: object
                    properties:
                      status: { type: string, enum: [ignored, unmatched, duplicate] }
                      reason: { type: string, example: ambiguous_amount }
                      unmatched_payment_id: { type: string, format: uuid }
        "400":
          description: invalid_payment (the body is not a valid payment) or invalid_json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unknown, disabled or badly signed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/payment-connections:
    get:
      tags: [Payment connections]
      summary: List payment connections
      description: Admin or manager. balance_minor is the connection's clearing account 1100-CODE, what the provider still holds for the merchant. The secret is never returned.
      operationId: listPaymentConnections
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Connections, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment_connections:
                    type: array
                    items: { $ref: "#/components/schemas/PaymentConnection" }
    post:
      tags: [Payment connections]
      summary: Create a payment connection
      description: |
        Admin only. A connection is one place the merchant receives non-cash money: a Paystack account, a Moniepoint or Monnify
        account, a card or tap terminal, a bank account watched by a feed. Creating one also creates its clearing account 1100-CODE.
        secret is the provider's webhook signing secret (16 to 200 characters) and is required, except for provider till, where it is
        generated and returned once in this response.
      operationId: createPaymentConnection
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, provider]
              additionalProperties: false
              properties:
                code: { type: string, pattern: "^[A-Z0-9]{2,8}$", example: MONIE, description: Unique per merchant. Lower case is upper-cased. }
                name: { type: string, maxLength: 80, example: Moniepoint terminal }
                provider: { type: string, enum: [till, paystack, flutterwave, monnify] }
                secret: { type: string, minLength: 16, maxLength: 200, description: Required except for provider till. }
                outlet_id: { type: string, format: uuid, description: Optional. Money with no reference is looked for at this outlet. }
                account_number: { type: string, maxLength: 40, description: Optional. The account customers pay into. }
      responses:
        "201":
          description: The connection. secret is present only when Till generated it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentConnection" }
        "400":
          description: invalid_connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: connection_code_taken
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/Error"
        "404":
          description: outlet_id is not in this merchant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/payment-connections/{id}:
    delete:
      tags: [Payment connections]
      summary: Disable a payment connection
      description: Admin only. A disabled connection answers 401 to every webhook and rejects manual payments. Its history and clearing balance stay.
      operationId: disablePaymentConnection
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Disabled
        "404":
          $ref: "#/components/responses/Error"

  /v1/payment-connections/{id}/settlements:
    post:
      tags: [Payment connections]
      summary: Record a provider payout to the bank
      description: Admin only. Requires Idempotency-Key. Posts Dr 1050 Bank / Cr 1100-CODE clearing. 1050 is created on first use.
      operationId: createPaymentSettlement
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_minor]
              additionalProperties: false
              properties:
                amount_minor: { type: integer, minimum: 1 }
                reference: { type: string, maxLength: 100, description: The provider's payout reference. }
      responses:
        "201":
          description: The settlement
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settlement" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: idempotency_conflict or idempotency_in_progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/payment-connections/{id}/payments:
    post:
      tags: [Payment connections]
      summary: Record a payment by hand
      description: |
        Admin or manager, or an API key with the manager role. A cashier gets 403. Same body as the till format, with no signature.
        For money Till cannot hear about by webhook: a transfer checked in the bank app, a terminal that is not integrated.
        The staff member is on the audit trail. It takes the same path as a webhook: deduplicated once per connection and event id,
        matched to an order by reference or by amount, or opened as an unmatched payment. This replaces a "mark paid" button: it needs
        a manager and a provider event id. Unknown fields are rejected.
      operationId: recordPayment
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TillPayment" }
      responses:
        "200":
          description: Paid order, an unmatched payment, an ignored event, or the stored answer to a repeated event
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Order"
                  - type: object
                    properties:
                      status: { type: string, enum: [ignored, unmatched, duplicate] }
                      reason: { type: string, example: ambiguous_amount }
                      unmatched_payment_id: { type: string, format: uuid }
        "400":
          description: invalid_payment or invalid_json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: connection_inactive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/unmatched-payments:
    get:
      tags: [Unmatched payments]
      summary: List payments that could not be applied
      description: Admin or manager. Managers must pass outlet_id for an outlet they are assigned to. Includes money that matched no order and refunded awaited-method sales (reason order_refund).
      operationId: listUnmatchedPayments
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/outletId"
        - in: query
          name: status
          schema: { type: string, enum: [open, applied, refund_pending, refunded] }
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Unmatched payments, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  unmatched_payments:
                    type: array
                    items: { $ref: "#/components/schemas/UnmatchedPayment" }
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /v1/unmatched-payments/{id}/apply:
    post:
      tags: [Unmatched payments]
      summary: Apply an open payment to a pending or expired order
      description: |
        Admin or manager. Requires Idempotency-Key. The order is the one named by order_id, or else the order the payment was matched to.
        A pending order takes the payment when the amount equals what the order is waiting for. An expired order takes it when the
        amount equals the order total and the stock is available again. The payment must be NGN. Re-runs the sale posting with
        Dr 2300 Payment suspense instead of clearing. Otherwise 409 unmatched_not_applicable or insufficient_stock.
        A non-admin must be assigned to that order's outlet (else 403). A payment with no outlet can only be resolved by an admin.
      operationId: applyUnmatchedPayment
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                order_id: { type: string, format: uuid, description: "Needed when the payment has no order yet (reasons no_matching_order and ambiguous_amount). Otherwise optional." }
      responses:
        "200":
          description: The payment (status applied) with the paid order under order
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnmatchedPayment" }
        "409":
          description: unmatched_not_open, unmatched_not_applicable, insufficient_stock, or an idempotency conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/unmatched-payments/{id}/refund:
    post:
      tags: [Unmatched payments]
      summary: Queue an open payment for refund
      description: Admin or manager. Requires Idempotency-Key. Status becomes refund_pending. Posts Dr 2300 Payment suspense / Cr 2310 Refunds payable.
      operationId: refundUnmatchedPayment
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "200":
          description: The payment, now refund_pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnmatchedPayment" }
        "409":
          description: unmatched_not_open or an idempotency conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/unmatched-payments/{id}/refunded:
    post:
      tags: [Unmatched payments]
      summary: Record that a queued refund was paid out
      description: Admin or manager. Requires Idempotency-Key. Status becomes refunded. Posts Dr 2310 Refunds payable / Cr the clearing account (1100-CODE) of the connection the money came in on. Also closes the refund of an awaited-method sale.
      operationId: settleUnmatchedRefund
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "200":
          description: The payment, now refunded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnmatchedPayment" }
        "409":
          description: unmatched_not_refund_pending or an idempotency conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/reports/daily-sales:
    get:
      tags: [Reports]
      summary: Paid sales for one Lagos calendar day
      description: |
        Admin or manager. outlet_id is required for every role. Omit date to use today in Africa/Lagos.
        Sales count on the day they were paid, even if refunded later; pending, expired and voided orders are excluded.
        Refunds count on the day they were made. net_sales_minor = total_minor - refunds_minor.
        matches_books is true when total_minor equals the asset and liability debits on the sale journals (cash, clearing, wallet,
        suspense, deposits held) and refunds_minor equals the asset and liability credits on that day's refund journals.
      operationId: dailySales
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/outletId"
        - in: query
          name: date
          schema: { type: string, format: date }
      responses:
        "200":
          description: Daily sales
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailySales" }

  /v1/reports/stock-on-hand:
    get:
      tags: [Reports]
      summary: Stock at one outlet
      description: Any signed-in role that can access the outlet. available is on_hand minus reserved.
      operationId: stockOnHand
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/outletId"
      responses:
        "200":
          description: Stock rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  outlet_id: { type: string, format: uuid }
                  stock:
                    type: array
                    items: { $ref: "#/components/schemas/StockRow" }

  /v1/reports/low-stock:
    get:
      tags: [Reports]
      summary: Lines at or under the reorder level
      description: Low when available (on_hand - reserved) is less than or equal to reorder_level.
      operationId: lowStock
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/outletId"
      responses:
        "200":
          description: Low lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  outlet_id: { type: string, format: uuid }
                  low_stock:
                    type: array
                    items: { $ref: "#/components/schemas/StockRow" }

  /v1/audit:
    get:
      tags: [Audit]
      summary: Who did what, and when
      description: Admin or manager. Admin may omit outlet_id. Manager must pass an outlet.
      operationId: listAudit
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/outletId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Audit events, append-only
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }

  /v1/staff:
    get:
      tags: [Staff]
      summary: List staff
      operationId: listStaff
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Admin only
          content:
            application/json:
              schema:
                type: object
                properties:
                  staff:
                    type: array
                    items: { $ref: "#/components/schemas/Staff" }
    post:
      tags: [Staff]
      summary: Create staff
      description: Admin only. Password minimum 12 characters. Manager and cashier need at least one outlet_id. Admin does not.
      operationId: createStaff
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, role]
              additionalProperties: false
              properties:
                email: { type: string }
                password: { type: string, minLength: 12 }
                role: { type: string, enum: [admin, manager, cashier] }
                outlet_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "201":
          description: The staff object itself. The password hash is not included.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Staff" }
        "409":
          description: email_taken
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/staff/{id}/disable:
    post:
      tags: [Staff]
      summary: Disable a staff login
      description: Admin only. The last active admin cannot be disabled.
      operationId: disableStaff
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The disabled staff object
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Staff" }
        "409":
          description: last_admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/invariants:
    get:
      tags: [Ledger]
      summary: Double-entry identity
      description: |
        Admin only, read from one snapshot. holds is true when every check holds: the trial-balance identity is 0, cached balances match the journal,
        wallet 2200 equals the sum of customer balances, suspense 2300 equals the open unmatched payments,
        refunds payable 2310 equals the refund_pending payments, and inventory 1200 is within one kobo per unit of sum(on_hand * avg_cost)
        (residue_minor and tolerance_minor are reported for that check).
      operationId: invariants
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  holds: { type: boolean }
                  identity_minor: { type: integer }
                  cache_drift: { type: integer }
                  accounts: { type: integer }
                  journals: { type: integer }
                  checks:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        holds: { type: boolean }
                        expected: { type: integer }
                        actual: { type: integer }
                        residue_minor: { type: integer }
                        tolerance_minor: { type: integer }

  /v1/accounts:
    get:
      tags: [Ledger]
      summary: Chart of accounts
      operationId: listAccounts
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Admin only
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
    post:
      tags: [Ledger]
      summary: Create an account
      description: Admin only. Currency is NGN. Free-form accounts are for the books, not for the till screen.
      operationId: createAccount
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "409":
          description: code_taken
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/accounts/{id}:
    get:
      tags: [Ledger]
      summary: Get an account
      operationId: getAccount
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Account. Another merchant's id is 404.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }

  /v1/accounts/{id}/statement:
    get:
      tags: [Ledger]
      summary: Statement with a running balance
      operationId: accountStatement
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Statement
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /v1/journals:
    post:
      tags: [Ledger]
      summary: Post a balanced journal
      description: Admin only. Requires Idempotency-Key. 2 to 20 postings. Each account at most once. Debits must equal credits. Unknown fields are rejected. A line on a system account (1100, any 1100-CODE clearing account, 1200, 2100, 2150, 2200, 2300, 2310, 2400, 5000) is 409 control_account. 1050 Bank is not a system account, so an opening balance can be posted to it.
      operationId: postJournal
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [postings]
              additionalProperties: false
              properties:
                description: { type: string }
                postings:
                  type: array
                  items: { $ref: "#/components/schemas/PostingInput" }
      responses:
        "201":
          description: Posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Journal" }
        "400":
          $ref: "#/components/responses/Error"
    get:
      tags: [Ledger]
      summary: List journals
      operationId: listJournals
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Journals
          content:
            application/json:
              schema:
                type: object
                properties:
                  journals:
                    type: array
                    items: { $ref: "#/components/schemas/Journal" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }

  /v1/journals/{id}:
    get:
      tags: [Ledger]
      summary: Get a journal
      operationId: getJournal
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Journal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Journal" }

  /v1/journals/{id}/reversal:
    post:
      tags: [Ledger]
      summary: Reverse a journal by appending
      description: Admin only. Requires Idempotency-Key. Does not update the original rows. A journal attached to an order returns 409 refund_via_order. A reversal that would touch a system account (including any 1100-CODE clearing account) is 409 control_account.
      operationId: reverseJournal
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "201":
          description: Reversal journal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Journal" }
        "409":
          description: refund_via_order, control_account, or already_reversed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /livez:
    get:
      tags: [Ops]
      summary: Liveness
      description: 200 while the process is serving. Does not touch the database.
      operationId: livez
      responses:
        "200": { description: Process is up }

  /readyz:
    get:
      tags: [Ops]
      summary: Readiness
      description: 200 when the database answers, the sweeper has completed a pass within 3x its interval, and the process is not shutting down. Otherwise 503 with the failing check.
      operationId: readyz
      responses:
        "200": { description: Ready }
        "503": { description: Not ready }

  /metrics:
    get:
      tags: [Ops]
      summary: Prometheus metrics
      description: "Text format. http_requests_total{route,status}, http_request_duration_seconds histogram, login_failures_total, rate_limited_total{scope}. Not authenticated: restrict it at the proxy."
      operationId: metrics
      responses:
        "200":
          description: Prometheus exposition format
          content:
            text/plain: { schema: { type: string } }

  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Log out everywhere
      description: Bumps the staff member's token version, so every token issued so far stops working. Not available to API keys.
      operationId: logout
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Logged out }
        "401":
          $ref: "#/components/responses/Error"

  /v1/auth/password:
    post:
      tags: [Auth]
      summary: Change own password
      description: Requires the current password (wrong guesses count toward lockout). New password is 12 to 128 characters and differs from the current one. Revokes every older token and returns a fresh one.
      operationId: changePassword
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              additionalProperties: false
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "200":
          description: New token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /v1/staff/{id}/password-reset:
    post:
      tags: [Staff]
      summary: Reset a staff password
      description: Admin only. Sets a new password, clears any lockout and revokes the person's tokens.
      operationId: resetStaffPassword
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              additionalProperties: false
              properties:
                new_password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "200": { description: Password reset }
        "404":
          $ref: "#/components/responses/Error"

  /v1/api-keys:
    get:
      tags: [ApiKeys]
      summary: List API keys
      description: Admin only. Secrets are never listed. last_used_at is updated at most once a minute.
      operationId: listApiKeys
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Keys, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_keys:
                    type: array
                    items: { $ref: "#/components/schemas/ApiKey" }
    post:
      tags: [ApiKeys]
      summary: Create an API key
      description: |
        Admin only. The response contains `secret` (`till_live_<prefix>_<secret>`) exactly once; Till stores only a SHA-256 digest.
        Send it as `Authorization: Bearer till_live_...`. The key acts as a cashier or manager limited to the listed outlets. Each key is backed by a non-login staff row (`staff_id`), which is the actor recorded in orders and audit.
      operationId: createApiKey
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role, outlet_ids]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 80 }
                role: { type: string, enum: [cashier, manager] }
                outlet_ids:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
      responses:
        "201":
          description: Key with its one-time secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKey" }

  /v1/api-keys/{id}:
    delete:
      tags: [ApiKeys]
      summary: Revoke an API key
      description: Admin only. Takes effect immediately.
      operationId: revokeApiKey
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The revoked key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKey" }
        "404":
          $ref: "#/components/responses/Error"

  # ---- shop operations ----
  /v1/shifts/open:
    post:
      tags: [Shifts]
      summary: Open a till shift
      description: One open shift per staff member per outlet (409 shift_already_open).
      operationId: openShift
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outlet_id]
              additionalProperties: false
              properties:
                outlet_id: { type: string, format: uuid }
                opening_float_minor: { type: integer, minimum: 0, default: 0 }
      responses:
        "201":
          description: The open shift
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shift" }
        "409":
          $ref: "#/components/responses/Error"

  /v1/shifts:
    get:
      tags: [Shifts]
      summary: List shifts
      description: Cashiers see their own; managers and admins see the outlet. Non-admins must pass outlet_id.
      operationId: listShifts
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/outletId"
        - $ref: "#/components/parameters/limit"
        - { in: query, name: status, schema: { type: string, enum: [open, closed] } }
      responses:
        "200":
          description: Shifts, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  shifts:
                    type: array
                    items: { $ref: "#/components/schemas/Shift" }

  /v1/shifts/{id}:
    get:
      tags: [Shifts]
      summary: One shift
      operationId: getShift
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The shift
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shift" }
        "404":
          $ref: "#/components/responses/Error"

  /v1/shifts/{id}/z-report:
    get:
      tags: [Shifts]
      summary: Z-report (live for an open shift, frozen once closed)
      description: |
        Expected cash = opening float + debits - credits to the outlet cash account (1000-CODE)
        from journals this staff member posted between open and close. Journals carry no actor, so
        they are matched to the staff member by the audit event written in the same transaction.
      operationId: shiftZReport
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZReport" }

  /v1/shifts/{id}/close:
    post:
      tags: [Shifts]
      summary: Count the drawer and close the shift
      description: |
        The owner, or any manager/admin of the outlet. Variance = counted - expected. A non-zero
        variance posts cash against account 5300 "Cash over/short" (short: Dr 5300 / Cr cash;
        over: Dr cash / Cr 5300). A second close is 409 already_closed.
      operationId: closeShift
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [counted_cash_minor]
              additionalProperties: false
              properties:
                counted_cash_minor: { type: integer, minimum: 0 }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: The closed shift with its z_report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shift" }
        "409":
          $ref: "#/components/responses/Error"

  /v1/events:
    get:
      tags: [Events]
      summary: Public event feed
      description: |
        Admin only. Events derived from the audit log, oldest first, polled with next_cursor
        (an empty page echoes the cursor you sent). Types: order.paid, order.refunded, order.voided,
        order.expired, payment.unmatched, stock.received, stock.adjusted, stock.counted, shift.opened,
        shift.closed, transfer.sent, transfer.received, transfer.cancelled, supplier.payment.
        stock.low is computed by the webhook worker and is not in this feed.
      operationId: listEvents
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/cursor"
        - { in: query, name: types, description: Comma-separated event types, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }

  /v1/webhook-endpoints:
    post:
      tags: [Events]
      summary: Register a webhook endpoint
      description: |
        Admin only. https only (http://localhost and 127.0.0.1 are allowed outside production);
        private and link-local targets are blocked in production. The signing secret is returned
        once. Each delivery is a POST with Till-Signature "t=<unix>,v1=<hex HMAC-SHA256 of t.body>"
        and Till-Event-Id; non-2xx or errors are retried with exponential backoff up to 8 attempts.
        Redirects are never followed. Empty event_types means every type (including stock.low).
      operationId: createWebhookEndpoint
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              additionalProperties: false
              properties:
                url: { type: string }
                event_types: { type: array, items: { type: string } }
      responses:
        "201":
          description: The endpoint, with its secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpoint" }
    get:
      tags: [Events]
      summary: List webhook endpoints
      operationId: listWebhookEndpoints
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Endpoints (no secrets)
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook_endpoints:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookEndpoint" }

  /v1/webhook-endpoints/{id}:
    delete:
      tags: [Events]
      summary: Delete a webhook endpoint
      operationId: deleteWebhookEndpoint
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Deleted; pending deliveries are dropped

  /v1/webhook-endpoints/{id}/deliveries:
    get:
      tags: [Events]
      summary: Delivery attempts for an endpoint
      operationId: listWebhookDeliveries
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Deliveries, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  deliveries:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        event_id: { type: string, format: uuid }
                        event_type: { type: string }
                        status: { type: string, enum: [pending, delivered, failed] }
                        attempts: { type: integer }
                        next_attempt_at: { type: string, format: date-time }
                        last_status: { type: integer, nullable: true }
                        last_error: { type: string, nullable: true }
                        delivered_at: { type: string, format: date-time, nullable: true }

  /v1/stock/transfers:
    post:
      tags: [Stock]
      summary: Send stock to another outlet
      description: |
        Manager of the source outlet or admin. Deducts from the source (never below reserved) and
        records the transfer as in_transit. No journal is posted: inventory (1200) is merchant-wide
        and average cost is per product. /v1/invariants counts units in transit at average cost.
      operationId: createTransfer
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_outlet_id, to_outlet_id, lines]
              additionalProperties: false
              properties:
                from_outlet_id: { type: string, format: uuid }
                to_outlet_id: { type: string, format: uuid }
                note: { type: string }
                lines:
                  type: array
                  items:
                    type: object
                    required: [sku, quantity]
                    properties:
                      sku: { type: string }
                      quantity: { type: integer, minimum: 1 }
      responses:
        "201":
          description: The in-transit transfer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockTransfer" }
        "409":
          $ref: "#/components/responses/Error"
    get:
      tags: [Stock]
      summary: List stock transfers
      operationId: listStockTransfers
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [in_transit, received, cancelled] } }
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Transfers, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  transfers:
                    type: array
                    items: { $ref: "#/components/schemas/StockTransfer" }

  /v1/stock/transfers/{id}:
    get:
      tags: [Stock]
      summary: One stock transfer
      operationId: getStockTransfer
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The transfer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockTransfer" }

  /v1/stock/transfers/{id}/receive:
    post:
      tags: [Stock]
      summary: Receive a transfer at the destination
      description: Manager of the destination outlet or admin. 409 transfer_not_in_transit if already settled.
      operationId: receiveTransfer
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The received transfer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockTransfer" }

  /v1/stock/transfers/{id}/cancel:
    post:
      tags: [Stock]
      summary: Cancel an in-transit transfer
      description: Manager of the source outlet or admin. Returns the units to the source.
      operationId: cancelTransfer
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The cancelled transfer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockTransfer" }

  /v1/stock/counts:
    post:
      tags: [Stock]
      summary: Record a stock count
      description: |
        Manager or admin. Per line, variance = counted - on_hand. A non-zero variance is posted
        through the adjustment path (Dr/Cr inventory 1200 against 5200 at average cost, reason
        stock_count) and on_hand becomes the counted figure. Counting below reserved is 409
        insufficient_stock and the whole count is rolled back.
      operationId: createStockCount
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outlet_id, lines]
              additionalProperties: false
              properties:
                outlet_id: { type: string, format: uuid }
                note: { type: string }
                lines:
                  type: array
                  items:
                    type: object
                    required: [sku, counted]
                    properties:
                      sku: { type: string }
                      counted: { type: integer, minimum: 0 }
      responses:
        "201":
          description: The count with per-line variances
          content:
            application/json:
              schema: { type: object }

  /v1/stock/counts/{id}:
    get:
      tags: [Stock]
      summary: One stock count
      operationId: getStockCount
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The count
          content:
            application/json:
              schema: { type: object }

  /v1/suppliers:
    post:
      tags: [Suppliers]
      summary: Create a supplier
      description: Manager or admin. A stock receipt may carry supplier_id to link it to a supplier.
      operationId: createSupplier
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string }
                phone: { type: string }
                note: { type: string }
      responses:
        "201":
          description: The supplier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Supplier" }
    get:
      tags: [Suppliers]
      summary: List suppliers
      operationId: listSuppliers
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Suppliers
          content:
            application/json:
              schema:
                type: object
                properties:
                  suppliers:
                    type: array
                    items: { $ref: "#/components/schemas/Supplier" }

  /v1/suppliers/{id}:
    get:
      tags: [Suppliers]
      summary: One supplier
      operationId: getSupplier
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The supplier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Supplier" }
    patch:
      tags: [Suppliers]
      summary: Update a supplier
      operationId: patchSupplier
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
                phone: { type: string }
                note: { type: string }
      responses:
        "200":
          description: The supplier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Supplier" }
    delete:
      tags: [Suppliers]
      summary: Delete (hide) a supplier
      description: Receipts and payments stay in the books.
      operationId: deleteSupplier
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Deleted

  /v1/suppliers/{id}/statement:
    get:
      tags: [Suppliers]
      summary: Receipts vs payments and the balance owed
      operationId: supplierStatement
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Statement
          content:
            application/json:
              schema:
                type: object
                properties:
                  supplier: { $ref: "#/components/schemas/Supplier" }
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string, enum: [receipt, payment] }
                        id: { type: string, format: uuid }
                        at: { type: string, format: date-time }
                        amount_minor: { type: integer }
                        detail: { type: string }
                  total_received_minor: { type: integer }
                  total_paid_minor: { type: integer }
                  balance_owed_minor: { type: integer }

  /v1/supplier-payments:
    post:
      tags: [Suppliers]
      summary: Pay a supplier
      description: |
        Manager or admin. Posts Dr 2150 Goods received / Cr outlet cash (method cash) or
        Cr 1050 Bank (method bank). A payment the cash or bank account cannot cover is rejected.
      operationId: createSupplierPayment
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplier_id, outlet_id, amount_minor, method]
              additionalProperties: false
              properties:
                supplier_id: { type: string, format: uuid }
                outlet_id: { type: string, format: uuid }
                amount_minor: { type: integer, minimum: 1 }
                method: { type: string, enum: [cash, bank] }
                note: { type: string }
      responses:
        "201":
          description: The payment and its journal id
          content:
            application/json:
              schema: { type: object }

  /v1/reports/vat:
    get:
      tags: [Reports]
      summary: VAT summary by month
      description: |
        Admin only. Output VAT is credits to 2100 from sale journals; reversed VAT is debits to 2100
        (refunds, voids, hand-posted remittances). Months are Africa/Lagos. Input VAT is a placeholder 0.
        Defaults to the last 12 months.
      operationId: vatReport
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: from, schema: { type: string } }
        - { in: query, name: to, schema: { type: string } }
      responses:
        "200":
          description: Monthly and total VAT
          content:
            application/json:
              schema: { type: object }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A staff JWT from /v1/auth/login, or a machine API key (till_live_<prefix>_<secret>) from POST /v1/api-keys.

  parameters:
    id:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    outletId:
      in: query
      name: outlet_id
      required: false
      schema: { type: string, format: uuid }
    limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    cursor:
      in: query
      name: cursor
      description: Opaque value from the previous page next_cursor.
      schema: { type: string }
    idempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: |
        Scoped to the merchant and bound to the HTTP method, the resolved path and the canonical body.
        The same key on another order, customer, endpoint or body is 409 idempotency_conflict.
        A replay returns the stored response with header Idempotent-Replayed true.
        Keys starting with wh: or sys: (any case) are reserved: 400 idempotency_key_reserved.
        Keys are purged after 30 days.
      schema: { type: string, maxLength: 256 }
  headers:
    IdempotentReplayed:
      description: Present and true when the response is a stored replay of an earlier identical request.
      schema: { type: string, enum: ["true"] }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Shift:
      type: object
      properties:
        id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        staff_id: { type: string, format: uuid }
        status: { type: string, enum: [open, closed] }
        opening_float_minor: { type: integer }
        opened_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
        closed_by: { type: string, format: uuid, nullable: true }
        expected_cash_minor: { type: integer, nullable: true }
        counted_cash_minor: { type: integer, nullable: true }
        variance_minor: { type: integer, nullable: true }
        variance_journal_id: { type: string, format: uuid, nullable: true }
        note: { type: string }
        z_report: { $ref: "#/components/schemas/ZReport" }
    ZReport:
      type: object
      properties:
        shift_id: { type: string, format: uuid }
        opening_float_minor: { type: integer }
        sales_count: { type: integer }
        refund_count: { type: integer }
        cash_sales_minor: { type: integer }
        cash_in_minor: { type: integer }
        cash_out_minor: { type: integer }
        refunds_minor: { type: integer }
        expected_cash_minor: { type: integer }
        counted_cash_minor: { type: integer, nullable: true }
        variance_minor: { type: integer, nullable: true }
    Event:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        outlet_id: { type: string, format: uuid, nullable: true }
        occurred_at: { type: string, format: date-time }
        data: { type: object }
    WebhookEndpoint:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        event_types: { type: array, items: { type: string } }
        secret: { type: string, description: Returned only when the endpoint is created. }
        created_at: { type: string, format: date-time }
    StockTransfer:
      type: object
      properties:
        id: { type: string, format: uuid }
        from_outlet_id: { type: string, format: uuid }
        to_outlet_id: { type: string, format: uuid }
        status: { type: string, enum: [in_transit, received, cancelled] }
        note: { type: string }
        created_at: { type: string, format: date-time }
        lines:
          type: array
          items:
            type: object
            properties:
              sku: { type: string }
              quantity: { type: integer }
    Supplier:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        note: { type: string }
        created_at: { type: string, format: date-time }
    NextCursor:
      type: string
      nullable: true
      description: Pass as ?cursor= for the next page. null on the last page.
    ApiKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        role: { type: string, enum: [cashier, manager] }
        outlet_ids:
          type: array
          items: { type: string, format: uuid }
        staff_id: { type: string, format: uuid }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        secret: { type: string, description: Only in the create response }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: insufficient_stock }
            message: { type: string }

    Staff:
      type: object
      properties:
        id: { type: string, format: uuid }
        merchant_id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string, enum: [admin, manager, cashier] }
        disabled_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    Outlet:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        cash_account_id: { type: string, format: uuid }
        sales_account_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        price_minor: { type: integer, description: Kobo }
        avg_cost_minor: { type: integer, description: Weighted average cost in kobo }
        reorder_level: { type: integer }
        tax_class: { type: string, enum: [standard, exempt, zero], description: Admin only to set. Only standard lines carry VAT. }
        active: { type: boolean }
        created_at: { type: string, format: date-time }

    StockMove:
      type: object
      properties:
        sku: { type: string }
        outlet_id: { type: string, format: uuid }
        on_hand: { type: integer }
        avg_cost_minor: { type: integer, description: Present on a receipt }

    StockRow:
      type: object
      properties:
        sku: { type: string }
        name: { type: string }
        on_hand: { type: integer }
        reserved: { type: integer }
        available: { type: integer }
        reorder_level: { type: integer }
        price_minor: { type: integer }
        avg_cost_minor: { type: integer }
        value_minor: { type: integer, description: on_hand times average cost }
        low_stock: { type: boolean, description: Present on the low-stock report }

    OrderLine:
      type: object
      properties:
        sku: { type: string }
        qty: { type: integer }
        unit_price_minor: { type: integer }
        line_total_minor: { type: integer }
        product_id: { type: string, format: uuid }
        tax_class: { type: string, enum: [standard, exempt, zero] }
        discount_minor: { type: integer, description: This line's share of the order discount }
        vat_minor: { type: integer }
        net_minor: { type: integer }
        refunded_qty: { type: integer }

    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        status: { type: string, enum: [pending_payment, paid, expired, refunded, partially_refunded, voided] }
        payment_method: { type: string, enum: [cash, wallet, transfer, card, tap, ussd, qr, mobile_money, split] }
        payments: { type: array, items: { $ref: "#/components/schemas/Payment" } }
        discount_reason: { type: string }
        refunded_minor: { type: integer, description: Running total refunded }
        refund: { $ref: "#/components/schemas/Refund" }
        customer_id: { type: string, format: uuid, description: Set only on a wallet sale }
        reference: { type: string, example: IKJ-A1B2C3D4-000001 }
        total_minor: { type: integer, description: Amount the customer pays, after discount }
        vat_minor: { type: integer }
        net_minor: { type: integer }
        discount_minor: { type: integer }
        cost_minor: { type: integer, description: Average cost times quantity, snapshotted at payment }
        currency: { type: string, example: NGN }
        lines:
          type: array
          items: { $ref: "#/components/schemas/OrderLine" }
        journal_id: { type: string, format: uuid, description: Absent until the sale is posted }
        expires_at: { type: string, format: date-time }
        paid_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        refund_journal_id: { type: string, format: uuid, description: Set once refunded }
        refunded_at: { type: string, format: date-time }
        refunded_by: { type: string, format: uuid }
        refund_reason: { type: string }
        refund_record_id: { type: string, format: uuid, description: Refund response for a transfer sale. The unmatched payment to settle. }

    UnmatchedPayment:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid, nullable: true }
        outlet_id: { type: string, format: uuid, nullable: true }
        connection_id: { type: string, format: uuid, nullable: true, description: The payment connection the money came in on. Null for rows from before connections. }
        provider: { type: string, example: paystack }
        event_id: { type: string, description: "Provider event id, or refund:{order id} for a refunded awaited-method sale" }
        amount_minor: { type: integer }
        currency: { type: string }
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: Who paid and how, as reported. reference, method, fee_minor, paid_at, payer_name, payer_account, payer_bank, account_number, session_id, recorded_by (the staff id, when recorded by hand).
        reason: { type: string, enum: [no_matching_order, ambiguous_amount, order_expired, order_voided, order_already_paid, order_refunded, amount_mismatch, currency_mismatch, order_refund] }
        status: { type: string, enum: [open, applied, refund_pending, refunded] }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        resolved_by: { type: string, format: uuid, nullable: true }
        journal_id: { type: string, format: uuid, nullable: true, description: "Dr 1100-CODE / Cr 2300 on arrival (or the order reversal for order_refund)" }
        resolution_journal_id: { type: string, format: uuid, nullable: true, description: "Sale journal (apply) or Dr 2300 / Cr 2310 (refund)" }
        settlement_journal_id: { type: string, format: uuid, nullable: true, description: "Dr 2310 / Cr 1100-CODE" }
        order: { $ref: "#/components/schemas/Order" }

    DailySales:
      type: object
      properties:
        date: { type: string, format: date }
        outlet_id: { type: string, format: uuid }
        order_count: { type: integer }
        total_minor: { type: integer }
        vat_minor: { type: integer }
        net_minor: { type: integer }
        by_method:
          type: array
          items:
            type: object
            properties:
              method: { type: string }
              order_count: { type: integer }
              total_minor: { type: integer }
              vat_minor: { type: integer }
              net_minor: { type: integer }
        discount_total_minor: { type: integer }
        refund_count: { type: integer }
        refunds_minor: { type: integer, description: Refunds made that day }
        net_sales_minor: { type: integer, description: total_minor minus refunds_minor }
        tender_totals:
          type: object
          description: One <method>_minor key for each method used that day (card_minor, tap_minor, ussd_minor, qr_minor, mobile_money_minor). cash_minor, transfer_minor and wallet_minor are always present.
          required: [cash_minor, transfer_minor, wallet_minor]
          properties:
            cash_minor: { type: integer }
            transfer_minor: { type: integer }
            wallet_minor: { type: integer }
          additionalProperties: { type: integer }
        by_cashier:
          type: array
          items:
            type: object
            properties:
              staff_id: { type: string, format: uuid }
              email: { type: string }
              order_count: { type: integer }
              total_minor: { type: integer }
              discount_minor: { type: integer }
              refund_count: { type: integer }
              refunds_minor: { type: integer }
        books_debit_minor: { type: integer }
        books_refund_credit_minor: { type: integer }
        matches_books: { type: boolean }

    PaymentConnection:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: MONIE }
        name: { type: string }
        provider: { type: string, enum: [till, paystack, flutterwave, monnify] }
        active: { type: boolean }
        outlet_id: { type: string, format: uuid, description: Present when the connection is tied to an outlet. }
        account_number: { type: string }
        clearing_account_id: { type: string, format: uuid }
        balance_minor: { type: integer, description: "The clearing account 1100-CODE. What the provider still holds for the merchant, in kobo. It may be negative." }
        webhook_path: { type: string, example: /v1/webhooks/0190a1b2-0000-7000-8000-000000000001, description: Give the provider this path on your host as the webhook URL. }
        created_at: { type: string, format: date-time }
        secret: { type: string, description: "Only in the create response, and only for provider till." }

    TillPayment:
      type: object
      description: The standard payment format. Any system that knows a payment happened can post it to a connection. Amounts are integer minor units (kobo).
      required: [id, amount_minor]
      properties:
        id: { type: string, maxLength: 200, description: "The sender's own id for this payment. It is the dedupe key, unique per connection." }
        reference: { type: string, description: "The order reference, when the payer or checkout carried one." }
        amount_minor: { type: integer, minimum: 1 }
        fee_minor: { type: integer, minimum: 0, description: What the provider kept. Must be less than the amount. }
        currency: { type: string, default: NGN, minLength: 3, maxLength: 3 }
        status: { type: string, enum: [success, failed, reversed], default: success }
        method: { type: string, enum: [transfer, card, tap, ussd, qr, mobile_money] }
        paid_at: { type: string, format: date-time }
        payer:
          type: object
          properties:
            name: { type: string }
            account: { type: string }
            bank: { type: string }
        account_number: { type: string, description: The account the money landed in. }
        session_id: { type: string, description: The NIP session id of a bank transfer. }

    Settlement:
      type: object
      properties:
        id: { type: string, format: uuid }
        connection_id: { type: string, format: uuid }
        amount_minor: { type: integer }
        reference: { type: string }
        journal_id: { type: string, format: uuid, description: Dr 1050 Bank / Cr 1100-CODE }
        balance_minor: { type: integer, description: The connection's clearing balance after the payout. }
        created_at: { type: string, format: date-time }

    MerchantSettings:
      type: object
      properties:
        vat_registered: { type: boolean }
        vat_inclusive_bps: { type: integer }
        max_discount_bps_cashier: { type: integer, description: Default 1000 }
        max_discount_bps_manager: { type: integer, description: Default 3000 }

    Payment:
      type: object
      properties:
        method: { type: string, enum: [cash, wallet, transfer, card, tap, ussd, qr, mobile_money] }
        status: { type: string, enum: [pending, held, confirmed, returned] }
        amount_minor: { type: integer }
        refunded_minor: { type: integer }

    Refund:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        journal_id: { type: string, format: uuid }
        amount_minor: { type: integer }
        net_minor: { type: integer }
        vat_minor: { type: integer }
        cost_minor: { type: integer }
        lines: { type: array, items: { type: object, additionalProperties: true } }
        tenders: { type: object, additionalProperties: { type: integer } }
        reason: { type: string }
        staff_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    AuditEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        staff_id: { type: string, format: uuid, nullable: true }
        action: { type: string, example: order.paid }
        entity_type: { type: string }
        entity_id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid, nullable: true }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }

    Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        balance_minor: { type: integer, description: Store credit in kobo. Cannot go below zero. }
        created_at: { type: string, format: date-time }

    Account:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [asset, liability, equity, income, expense] }
        currency: { type: string, example: NGN }
        allow_negative: { type: boolean }
        status: { type: string, enum: [open, closed] }
        balance_minor: { type: integer }
        created_at: { type: string, format: date-time }

    AccountCreate:
      type: object
      required: [code, name, type]
      properties:
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [asset, liability, equity, income, expense] }
        allow_negative: { type: boolean }

    PostingInput:
      type: object
      required: [account_id, direction, amount_minor]
      properties:
        account_id: { type: string, format: uuid }
        direction: { type: string, enum: [debit, credit] }
        amount_minor: { type: integer, minimum: 1 }

    Journal:
      type: object
      properties:
        id: { type: string, format: uuid }
        description: { type: string }
        created_at: { type: string, format: date-time }
        reverses_journal_id: { type: string, format: uuid, nullable: true }
        postings:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              account_id: { type: string, format: uuid }
              direction: { type: string }
              amount_minor: { type: integer }
              currency: { type: string }
