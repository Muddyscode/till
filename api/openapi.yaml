openapi: 3.0.3
info:
  title: Till
  version: 1.0.0
  description: |
    POS ledger and inventory API for one merchant with many outlets.
    Money is integer kobo (NGN). Stock quantities are integers.
    A cash sale deducts stock and posts a balanced journal in one Postgres transaction.
    A transfer reserves stock until a signed Paystack-style webhook posts the sale.
    A wallet sale spends store credit held as a liability of this merchant. It is not a licensed e-money wallet.
    Average cost, cost of goods, and an order-level discount are part of that same transaction.
    There is no public registration. Staff log in with a role of admin, manager, or cashier.

servers:
  - url: http://127.0.0.1:8080

tags:
  - name: Health
  - name: Auth
  - name: Outlets
  - name: Products
  - name: Stock
  - name: Customers
  - name: Orders
  - name: Merchant
  - name: Payments
  - name: Unmatched payments
  - name: Reports
  - name: Audit
  - name: Staff
  - name: ApiKeys
  - name: Ops
  - name: Ledger

paths:
  /v1/health:
    get:
      tags: [Health]
      summary: Liveness and database ping
      operationId: health
      responses:
        "200":
          description: Database is reachable
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: ok }
        "503":
          $ref: "#/components/responses/Error"

  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in a staff member
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Bearer token. Lifetime is TILL_TOKEN_TTL (default 8h). It carries jti and a per-staff token version, so logout or a password change revokes it.
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at, staff]
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
                  staff: { $ref: "#/components/schemas/Staff" }
        "401":
          $ref: "#/components/responses/Error"
        "429":
          description: rate_limited (per IP or per email) or account_locked (10 failures in 15 minutes). Retry-After is set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/me:
    get:
      tags: [Auth]
      summary: Current staff
      operationId: me
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Staff row. Password hash is never returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  staff: { $ref: "#/components/schemas/Staff" }
        "401":
          $ref: "#/components/responses/Error"

  /v1/outlets:
    get:
      tags: [Outlets]
      summary: List outlets the caller can use
      operationId: listOutlets
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Admin sees every outlet of the merchant. Others see assigned outlets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  outlets:
                    type: array
                    items: { $ref: "#/components/schemas/Outlet" }
    post:
      tags: [Outlets]
      summary: Open an outlet and its cash and sales accounts
      description: Admin only. Creates accounts `1000-{CODE}` and `4000-{CODE}`.
      operationId: createOutlet
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code]
              additionalProperties: false
              properties:
                name: { type: string, example: Ikeja }
                code:
                  type: string
                  pattern: "^[A-Z0-9]{2,8}$"
                  example: IKJ
      responses:
        "201":
          description: Outlet created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Outlet" }
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          description: code_taken
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/products:
    get:
      tags: [Products]
      summary: List the merchant catalog
      operationId: listProducts
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
    post:
      tags: [Products]
      summary: Create a product
      description: Admin or manager. price_minor is integer kobo. Unknown fields are rejected.
      operationId: createProduct
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, name, price_minor]
              additionalProperties: false
              properties:
                sku: { type: string, example: SERUM-C }
                name: { type: string }
                price_minor: { type: integer, minimum: 1, example: 850000 }
                avg_cost_minor: { type: integer, minimum: 0, description: Opening average cost in kobo. Omit or 0 leaves the layer at zero until a receipt sets it. }
                reorder_level: { type: integer, minimum: 0 }
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400":
          $ref: "#/components/responses/Error"
        "409":
          description: sku_taken
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/products/{id}:
    patch:
      tags: [Products]
      summary: Change name, price, average cost, reorder level, or active flag
      description: |
        Admin or manager. A price change writes audit action product.price_changed.
        Changing avg_cost_minor while units are on hand posts the difference to inventory (1200)
        and inventory adjustment (5200). An increase credits 5200, which is allowed to go negative.
        That journal is not a cash transfer. A refund does not recompute the average.
        Requires Idempotency-Key. The product row is locked inside the transaction and the patch is applied to the locked row.
      operationId: patchProduct
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
                price_minor: { type: integer, minimum: 1 }
                avg_cost_minor: { type: integer, minimum: 0 }
                reorder_level: { type: integer, minimum: 0 }
                active: { type: boolean }
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
        "400":
          description: invalid_amount, invalid_order, idempotency_key_required, or idempotency_key_reserved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: idempotency_conflict or idempotency_in_progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/stock/receipts:
    post:
      tags: [Stock]
      summary: Receive units into an outlet
      description: |
        Admin or manager. Increases on_hand.
        unit_cost_minor is optional integer kobo. Omit it and the current average is used, with no journal when that average is 0.
        Explicit 0 pulls the weighted average down and books nothing.
        A positive booked cost debits inventory (1200) and credits goods received (2150). It does not take cash from the drawer.
        Requires Idempotency-Key, so a retried receipt cannot double the stock.
      operationId: receiveStock
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outlet_id, sku, qty]
              additionalProperties: false
              properties:
                outlet_id: { type: string, format: uuid }
                sku: { type: string }
                qty: { type: integer, minimum: 1 }
                unit_cost_minor: { type: integer, minimum: 0, description: Omit to keep the current average. Explicit 0 is allowed. }
                delta: { type: integer, description: Not used on a receipt. }
                reason: { type: string }
      responses:
        "200":
          description: New on_hand
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockMove" }
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/stock/adjustments:
    post:
      tags: [Stock]
      summary: Adjust on_hand by a signed delta
      description: |
        Admin or manager. reason is required. delta 0 is rejected. The result cannot pass below reserved or below zero.
        When the average cost is above zero, the same transaction debits or credits inventory at that average against account 5200.
        Requires Idempotency-Key.
      operationId: adjustStock
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outlet_id, sku, delta, reason]
              additionalProperties: false
              properties:
                outlet_id: { type: string, format: uuid }
                sku: { type: string }
                delta: { type: integer, example: -1 }
                reason: { type: string, example: damaged bottle }
                qty: { type: integer }
      responses:
        "200":
          description: New on_hand
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockMove" }
        "409":
          description: insufficient_stock
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/customers:
    get:
      tags: [Customers]
      summary: Search customers and their store-credit balances
      description: Cashiers must pass q (at least 3 characters, name or phone) and see the phone masked as 0803****567. Managers and admins see full numbers and may omit q.
      operationId: listCustomers
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: q, description: "Name substring or phone digits", schema: { type: string, minLength: 3 } }
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Customers, ordered by name
          content:
            application/json:
              schema:
                type: object
                properties:
                  customers:
                    type: array
                    items: { $ref: "#/components/schemas/Customer" }
    post:
      tags: [Customers]
      summary: Create a customer
      description: Any signed-in role, including a cashier. Phone is unique per merchant. This is store credit, not a bank account.
      operationId: createCustomer
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 80 }
                phone: { type: string, maxLength: 32, example: "08030001111", description: "Normalised to E.164 (+2348030001111). Invalid numbers are 400 invalid_phone." }
      responses:
        "201":
          description: Customer created with a zero balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "409":
          description: phone_taken
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/customers/{id}:
    get:
      tags: [Customers]
      summary: Get one customer
      operationId: getCustomer
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "404":
          $ref: "#/components/responses/Error"

  /v1/customers/{id}/topups:
    post:
      tags: [Customers]
      summary: Take cash and add store credit
      description: |
        Requires Idempotency-Key. Any signed-in role that can access the outlet.
        One transaction debits outlet cash, credits customer wallet (2200), and increases customers.balance_minor.
        The sum of those balances equals the wallet account.
      operationId: topUpCustomer
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outlet_id, amount_minor]
              additionalProperties: false
              properties:
                outlet_id: { type: string, format: uuid }
                amount_minor: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Updated customer plus journal_id
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Customer"
                  - type: object
                    properties:
                      journal_id: { type: string, format: uuid }
        "409":
          description: idempotency_conflict or idempotency_in_progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/orders:
    get:
      tags: [Orders]
      summary: List orders
      description: Admin may omit outlet_id. Manager and cashier must pass an outlet they can access.
      operationId: listOrders
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/outletId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - { in: query, name: status, schema: { type: string, enum: [pending_payment, paid, expired, refunded] } }
        - { in: query, name: reference, schema: { type: string } }
        - { in: query, name: customer_id, schema: { type: string, format: uuid } }
        - { in: query, name: from, description: "RFC 3339 or YYYY-MM-DD (Lagos time). created_at >= from.", schema: { type: string } }
        - { in: query, name: to, description: "RFC 3339 (exclusive) or YYYY-MM-DD (that whole day, Lagos time).", schema: { type: string } }
      responses:
        "200":
          description: Orders, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
    post:
      tags: [Orders]
      summary: Sell
      description: |
        Requires Idempotency-Key.
        Cash deducts on_hand and posts the sale journal. Response 201, status paid.
        Transfer increments reserved, status pending_payment, and posts nothing.
        Wallet requires customer_id, spends store credit, and posts in the same transaction. The balance cannot go negative (409 insufficient_wallet).
        discount_minor is optional integer kobo. Omit it or send 0 for no discount. It must be less than the shelf total. VAT is calculated on the amount the customer pays. The client cannot send a price.
        When the average cost is above zero, the sale journal also debits cost of goods (5000) and credits inventory (1200). A discount does not reduce that cost.
        Unknown JSON fields are rejected.
      operationId: createOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outlet_id, lines]
              additionalProperties: false
              description: Give either payment_method or payments (split tender), not both.
              properties:
                outlet_id: { type: string, format: uuid }
                payment_method: { type: string, enum: [cash, transfer, wallet] }
                payments:
                  type: array
                  minItems: 1
                  maxItems: 3
                  description: |
                    Split tender, at most one tender per method, amounts adding up to the payable (else 400 tender_mismatch).
                    Cash and wallet only posts at once. With a transfer tender the order is pending_payment, cash and wallet
                    are held in Deposits held 2400, and the webhook must be for the transfer amount only.
                  items:
                    type: object
                    required: [method, amount_minor]
                    additionalProperties: false
                    properties:
                      method: { type: string, enum: [cash, wallet, transfer] }
                      amount_minor: { type: integer, minimum: 1 }
                      customer_id: { type: string, format: uuid, description: Required on the wallet tender only }
                discount_reason: { type: string, maxLength: 200, description: Required when discount_minor > 0 (400 discount_reason_required). Over the role limit is 403 discount_limit. }
                customer_id: { type: string, format: uuid, description: Required for wallet. Must be omitted for cash and transfer. }
                discount_minor: { type: integer, minimum: 0, description: Order-level discount in kobo. Floats are rejected. }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sku, qty]
                    additionalProperties: false
                    properties:
                      sku: { type: string }
                      qty: { type: integer, minimum: 1 }
            example:
              outlet_id: 00000000-0000-7000-8000-000000000001
              payment_method: cash
              lines:
                - { sku: SERUM-C, qty: 1 }
      responses:
        "201":
          description: Order created, or the stored response for the same key and body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          $ref: "#/components/responses/Error"
        "403":
          description: outlet_forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Outlet is not in this merchant, or SKU is unknown
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: insufficient_stock, insufficient_wallet, idempotency_conflict, or idempotency_in_progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/orders/{id}:
    get:
      tags: [Orders]
      summary: Get one order
      operationId: getOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/orders/{id}/refund:
    post:
      tags: [Orders]
      summary: Refund a paid order, in whole or by line
      description: |
        Optional lines (product_id or sku, quantity) refund part of the order; no lines refunds everything left. Repeatable until
        refunded: status goes paid, partially_refunded, refunded. Discount and VAT are apportioned to lines at sale time. More units
        than are left is 409 refund_exceeds_order. refund_to (cash, wallet, transfer) sends all of it to one tender that still has
        enough; without it the money goes back to the original tender, pro rata across a split order. The response adds refund.
        Admin or manager. Restocks and reverses the sale journal in one transaction. A wallet sale also puts the paid amount back on the customer balance. The average cost is not recomputed.
        Requires Idempotency-Key. Body may be empty, {} or an object with an optional reason.
        The order records refund_journal_id, refunded_at, refunded_by and refund_reason.
        A transfer (Paystack) sale credits Refunds payable 2310 instead of clearing 1100 and returns refund_record_id,
        an unmatched payment in refund_pending. Close it with POST /v1/unmatched-payments/{id}/refunded once the money has left the provider.
        If an account would go negative the answer is 409 refund_insufficient_funds, naming the account.
      operationId: refundOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 200 }
                refund_to: { type: string, enum: [cash, wallet, transfer] }
                lines:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      product_id: { type: string, format: uuid }
                      sku: { type: string }
                      quantity: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Order is partially_refunded or refunded; refund describes this refund
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "409":
          description: refund_insufficient_funds, already_reversed, idempotency_conflict, or idempotency_in_progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/orders/{id}/void:
    post:
      tags: [Orders]
      summary: Void a pending order
      description: |
        Cashier at the outlet, manager or admin. Requires Idempotency-Key. Only a pending_payment order: the reservation is
        released, held cash and wallet tenders are returned, status becomes voided and order.voided is audited.
        A webhook arriving later goes to unmatched payments with reason order_voided.
      operationId: voidOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 200 }
      responses:
        "200":
          description: The voided order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          $ref: "#/components/responses/Error"

  /v1/merchant/settings:
    get:
      tags: [Merchant]
      summary: Discount limits and VAT settings
      description: Admin only.
      operationId: getSettings
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantSettings" }
    patch:
      tags: [Merchant]
      summary: Change discount limits and VAT settings
      description: Admin only. Applies to new orders. vat_registered false puts 0 VAT on every line.
      operationId: patchSettings
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                vat_registered: { type: boolean }
                vat_inclusive_bps: { type: integer, minimum: 0, maximum: 5000 }
                max_discount_bps_cashier: { type: integer, minimum: 0, maximum: 10000 }
                max_discount_bps_manager: { type: integer, minimum: 0, maximum: 10000 }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantSettings" }

  /v1/webhooks/paystack:
    post:
      tags: [Payments]
      summary: Mock Paystack charge.success
      description: |
        No bearer token. Header x-paystack-signature is hex HMAC-SHA512 of the raw body
        using TILL_PAYSTACK_SECRET. Amount is integer kobo.
        Only event charge.success can post a sale.
        Bad signature is 401 and changes nothing.
        Every signature-valid charge.success is recorded once in provider_events (provider, event id);
        a repeat of the same id replays the stored response with Idempotent-Replayed true and posts nothing.
        A reference that matches no order returns 200 status ignored, reason unknown_reference (event and audit row only).
        A reference that matches an order but cannot be applied (order_expired, order_already_paid, order_refunded,
        amount_mismatch, currency_mismatch) returns 200 status unmatched: Dr 1100 Paystack clearing / Cr 2300 Payment suspense
        and an open unmatched payment. See /v1/unmatched-payments.
      operationId: paystackWebhook
      parameters:
        - in: header
          name: x-paystack-signature
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, data]
              properties:
                event: { type: string, example: charge.success }
                data:
                  type: object
                  required: [id, reference, amount, currency, status]
                  properties:
                    id: { type: integer, minimum: 1, description: Paystack event id. Replay of the same id is idempotent. }
                    reference: { type: string }
                    amount: { type: integer, description: Kobo. Must equal the order total. }
                    currency: { type: string, example: NGN }
                    status: { type: string, example: success }
      responses:
        "200":
          description: Paid order, an unmatched payment, or an ignored event
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Order"
                  - type: object
                    properties:
                      status: { type: string, enum: [ignored, unmatched, duplicate] }
                      reason: { type: string, example: order_expired }
                      unmatched_payment_id: { type: string, format: uuid }
        "401":
          description: invalid signature
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/unmatched-payments:
    get:
      tags: [Unmatched payments]
      summary: List payments that could not be applied
      description: Admin or manager. Managers must pass outlet_id for an outlet they are assigned to. Includes refunded transfer sales (reason order_refund).
      operationId: listUnmatchedPayments
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/outletId"
        - in: query
          name: status
          schema: { type: string, enum: [open, applied, refund_pending, refunded] }
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Unmatched payments, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  unmatched_payments:
                    type: array
                    items: { $ref: "#/components/schemas/UnmatchedPayment" }
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /v1/unmatched-payments/{id}/apply:
    post:
      tags: [Unmatched payments]
      summary: Apply an open payment to its (expired) order
      description: |
        Admin or manager. Requires Idempotency-Key. Works only when the order is expired, the payment is NGN,
        the amount equals the order total and the stock is available again. Re-runs the sale posting with Dr 2300 Payment suspense
        instead of clearing. Otherwise 409 unmatched_not_applicable or insufficient_stock.
      operationId: applyUnmatchedPayment
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "200":
          description: The payment (status applied) with the paid order under order
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnmatchedPayment" }
        "409":
          description: unmatched_not_open, unmatched_not_applicable, insufficient_stock, or an idempotency conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/unmatched-payments/{id}/refund:
    post:
      tags: [Unmatched payments]
      summary: Queue an open payment for refund
      description: Admin or manager. Requires Idempotency-Key. Status becomes refund_pending. Posts Dr 2300 Payment suspense / Cr 2310 Refunds payable.
      operationId: refundUnmatchedPayment
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "200":
          description: The payment, now refund_pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnmatchedPayment" }
        "409":
          description: unmatched_not_open or an idempotency conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/unmatched-payments/{id}/refunded:
    post:
      tags: [Unmatched payments]
      summary: Record that a queued refund was paid out
      description: Admin or manager. Requires Idempotency-Key. Status becomes refunded. Posts Dr 2310 Refunds payable / Cr 1100 Paystack clearing. Also closes the refund of a transfer sale.
      operationId: settleUnmatchedRefund
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "200":
          description: The payment, now refunded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnmatchedPayment" }
        "409":
          description: unmatched_not_refund_pending or an idempotency conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/reports/daily-sales:
    get:
      tags: [Reports]
      summary: Paid sales for one Lagos calendar day
      description: |
        Admin or manager. outlet_id is required for every role. Omit date to use today in Africa/Lagos.
        Sales count on the day they were paid, even if refunded later; pending, expired and voided orders are excluded.
        Refunds count on the day they were made. net_sales_minor = total_minor - refunds_minor.
        matches_books is true when total_minor equals the asset and liability debits on the sale journals (cash, clearing, wallet,
        suspense, deposits held) and refunds_minor equals the asset and liability credits on that day's refund journals.
      operationId: dailySales
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/outletId"
        - in: query
          name: date
          schema: { type: string, format: date }
      responses:
        "200":
          description: Daily sales
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailySales" }

  /v1/reports/stock-on-hand:
    get:
      tags: [Reports]
      summary: Stock at one outlet
      description: Any signed-in role that can access the outlet. available is on_hand minus reserved.
      operationId: stockOnHand
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/outletId"
      responses:
        "200":
          description: Stock rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  outlet_id: { type: string, format: uuid }
                  stock:
                    type: array
                    items: { $ref: "#/components/schemas/StockRow" }

  /v1/reports/low-stock:
    get:
      tags: [Reports]
      summary: Lines at or under the reorder level
      description: Low when available (on_hand - reserved) is less than or equal to reorder_level.
      operationId: lowStock
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/outletId"
      responses:
        "200":
          description: Low lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  outlet_id: { type: string, format: uuid }
                  low_stock:
                    type: array
                    items: { $ref: "#/components/schemas/StockRow" }

  /v1/audit:
    get:
      tags: [Audit]
      summary: Who did what, and when
      description: Admin or manager. Admin may omit outlet_id. Manager must pass an outlet.
      operationId: listAudit
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/outletId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Audit events, append-only
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }

  /v1/staff:
    get:
      tags: [Staff]
      summary: List staff
      operationId: listStaff
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Admin only
          content:
            application/json:
              schema:
                type: object
                properties:
                  staff:
                    type: array
                    items: { $ref: "#/components/schemas/Staff" }
    post:
      tags: [Staff]
      summary: Create staff
      description: Admin only. Password minimum 12 characters. Manager and cashier need at least one outlet_id. Admin does not.
      operationId: createStaff
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, role]
              additionalProperties: false
              properties:
                email: { type: string }
                password: { type: string, minLength: 12 }
                role: { type: string, enum: [admin, manager, cashier] }
                outlet_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "201":
          description: The staff object itself. The password hash is not included.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Staff" }
        "409":
          description: email_taken
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/staff/{id}/disable:
    post:
      tags: [Staff]
      summary: Disable a staff login
      description: Admin only. The last active admin cannot be disabled.
      operationId: disableStaff
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The disabled staff object
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Staff" }
        "409":
          description: last_admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/invariants:
    get:
      tags: [Ledger]
      summary: Double-entry identity
      description: |
        Admin only, read from one snapshot. holds is true when every check holds: the trial-balance identity is 0, cached balances match the journal,
        wallet 2200 equals the sum of customer balances, suspense 2300 equals the open unmatched payments,
        refunds payable 2310 equals the refund_pending payments, and inventory 1200 is within one kobo per unit of sum(on_hand * avg_cost)
        (residue_minor and tolerance_minor are reported for that check).
      operationId: invariants
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  holds: { type: boolean }
                  identity_minor: { type: integer }
                  cache_drift: { type: integer }
                  accounts: { type: integer }
                  journals: { type: integer }
                  checks:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        holds: { type: boolean }
                        expected: { type: integer }
                        actual: { type: integer }
                        residue_minor: { type: integer }
                        tolerance_minor: { type: integer }

  /v1/accounts:
    get:
      tags: [Ledger]
      summary: Chart of accounts
      operationId: listAccounts
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Admin only
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
    post:
      tags: [Ledger]
      summary: Create an account
      description: Admin only. Currency is NGN. Free-form accounts are for the books, not for the till screen.
      operationId: createAccount
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "409":
          description: code_taken
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/accounts/{id}:
    get:
      tags: [Ledger]
      summary: Get an account
      operationId: getAccount
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Account. Another merchant's id is 404.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }

  /v1/accounts/{id}/statement:
    get:
      tags: [Ledger]
      summary: Statement with a running balance
      operationId: accountStatement
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Statement
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /v1/accounts/{id}/close:
    post:
      tags: [Ledger]
      summary: Close an account
      description: Admin only. A closed account rejects new postings.
      operationId: closeAccount
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }

  /v1/transfers:
    post:
      tags: [Ledger]
      summary: Two-legged transfer
      description: Admin only. Requires Idempotency-Key. Income cannot be the debit side except through a reversal. A line on a system account (1100, 1200, 2100, 2150, 2200, 2300, 2310, 5000) is 409 control_account.
      operationId: postTransfer
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [debit_account_id, credit_account_id, amount_minor]
              properties:
                debit_account_id: { type: string, format: uuid }
                credit_account_id: { type: string, format: uuid }
                amount_minor: { type: integer, minimum: 1 }
                description: { type: string }
      responses:
        "201":
          description: Posted journal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Journal" }
        "409":
          $ref: "#/components/responses/Error"
    get:
      tags: [Ledger]
      summary: List transfers
      operationId: listTransfers
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Journals that are transfers
          content:
            application/json:
              schema:
                type: object
                properties:
                  transfers:
                    type: array
                    items: { $ref: "#/components/schemas/Journal" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }

  /v1/transfers/{id}:
    get:
      tags: [Ledger]
      summary: Get a transfer journal
      operationId: getTransfer
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Journal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Journal" }

  /v1/journals:
    post:
      tags: [Ledger]
      summary: Post a balanced journal
      description: Admin only. Requires Idempotency-Key. 2 to 20 postings. Each account at most once. Debits must equal credits. A line on a system account (1100, 1200, 2100, 2150, 2200, 2300, 2310, 5000) is 409 control_account.
      operationId: postJournal
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [postings]
              properties:
                description: { type: string }
                postings:
                  type: array
                  items: { $ref: "#/components/schemas/PostingInput" }
      responses:
        "201":
          description: Posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Journal" }
        "400":
          $ref: "#/components/responses/Error"
    get:
      tags: [Ledger]
      summary: List journals
      operationId: listJournals
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Journals
          content:
            application/json:
              schema:
                type: object
                properties:
                  journals:
                    type: array
                    items: { $ref: "#/components/schemas/Journal" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }

  /v1/journals/{id}:
    get:
      tags: [Ledger]
      summary: Get a journal
      operationId: getJournal
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Journal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Journal" }

  /v1/journals/{id}/reversal:
    post:
      tags: [Ledger]
      summary: Reverse a journal by appending
      description: Admin only. Requires Idempotency-Key. Does not update the original rows. A journal attached to an order returns 409 refund_via_order. A reversal that would touch a system account is 409 control_account.
      operationId: reverseJournal
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "201":
          description: Reversal journal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Journal" }
        "409":
          description: refund_via_order, control_account, or already_reversed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /livez:
    get:
      tags: [Ops]
      summary: Liveness
      description: 200 while the process is serving. Does not touch the database.
      operationId: livez
      responses:
        "200": { description: Process is up }

  /readyz:
    get:
      tags: [Ops]
      summary: Readiness
      description: 200 when the database answers, the sweeper has completed a pass within 3x its interval, and the process is not shutting down. Otherwise 503 with the failing check.
      operationId: readyz
      responses:
        "200": { description: Ready }
        "503": { description: Not ready }

  /metrics:
    get:
      tags: [Ops]
      summary: Prometheus metrics
      description: "Text format. http_requests_total{route,status}, http_request_duration_seconds histogram, login_failures_total, rate_limited_total{scope}. Not authenticated: restrict it at the proxy."
      operationId: metrics
      responses:
        "200":
          description: Prometheus exposition format
          content:
            text/plain: { schema: { type: string } }

  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Log out everywhere
      description: Bumps the staff member's token version, so every token issued so far stops working. Not available to API keys.
      operationId: logout
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Logged out }
        "401":
          $ref: "#/components/responses/Error"

  /v1/auth/password:
    post:
      tags: [Auth]
      summary: Change own password
      description: Requires the current password (wrong guesses count toward lockout). New password is 12 to 128 characters and differs from the current one. Revokes every older token and returns a fresh one.
      operationId: changePassword
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              additionalProperties: false
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "200":
          description: New token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /v1/staff/{id}/password-reset:
    post:
      tags: [Staff]
      summary: Reset a staff password
      description: Admin only. Sets a new password, clears any lockout and revokes the person's tokens.
      operationId: resetStaffPassword
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              additionalProperties: false
              properties:
                new_password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "200": { description: Password reset }
        "404":
          $ref: "#/components/responses/Error"

  /v1/api-keys:
    get:
      tags: [ApiKeys]
      summary: List API keys
      description: Admin only. Secrets are never listed. last_used_at is updated at most once a minute.
      operationId: listApiKeys
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Keys, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_keys:
                    type: array
                    items: { $ref: "#/components/schemas/ApiKey" }
    post:
      tags: [ApiKeys]
      summary: Create an API key
      description: |
        Admin only. The response contains `secret` (`till_live_<prefix>_<secret>`) exactly once; Till stores only a SHA-256 digest.
        Send it as `Authorization: Bearer till_live_...`. The key acts as a cashier or manager limited to the listed outlets. Each key is backed by a non-login staff row (`staff_id`), which is the actor recorded in orders and audit.
      operationId: createApiKey
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role, outlet_ids]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 80 }
                role: { type: string, enum: [cashier, manager] }
                outlet_ids:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
      responses:
        "201":
          description: Key with its one-time secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKey" }

  /v1/api-keys/{id}:
    delete:
      tags: [ApiKeys]
      summary: Revoke an API key
      description: Admin only. Takes effect immediately.
      operationId: revokeApiKey
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The revoked key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKey" }
        "404":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A staff JWT from /v1/auth/login, or a machine API key (till_live_<prefix>_<secret>) from POST /v1/api-keys.

  parameters:
    id:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    outletId:
      in: query
      name: outlet_id
      required: false
      schema: { type: string, format: uuid }
    limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    cursor:
      in: query
      name: cursor
      description: Opaque value from the previous page next_cursor.
      schema: { type: string }
    idempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: |
        Scoped to the merchant and bound to the HTTP method, the resolved path and the canonical body.
        The same key on another order, customer, endpoint or body is 409 idempotency_conflict.
        A replay returns the stored response with header Idempotent-Replayed true.
        Keys starting with wh: or sys: (any case) are reserved: 400 idempotency_key_reserved.
        Keys are purged after 30 days.
      schema: { type: string, maxLength: 256 }
  headers:
    IdempotentReplayed:
      description: Present and true when the response is a stored replay of an earlier identical request.
      schema: { type: string, enum: ["true"] }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    NextCursor:
      type: string
      nullable: true
      description: Pass as ?cursor= for the next page. null on the last page.
    ApiKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        role: { type: string, enum: [cashier, manager] }
        outlet_ids:
          type: array
          items: { type: string, format: uuid }
        staff_id: { type: string, format: uuid }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        secret: { type: string, description: Only in the create response }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: insufficient_stock }
            message: { type: string }

    Staff:
      type: object
      properties:
        id: { type: string, format: uuid }
        merchant_id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string, enum: [admin, manager, cashier] }
        disabled_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    Outlet:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        cash_account_id: { type: string, format: uuid }
        sales_account_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        price_minor: { type: integer, description: Kobo }
        avg_cost_minor: { type: integer, description: Weighted average cost in kobo }
        reorder_level: { type: integer }
        tax_class: { type: string, enum: [standard, exempt, zero], description: Admin only to set. Only standard lines carry VAT. }
        active: { type: boolean }
        created_at: { type: string, format: date-time }

    StockMove:
      type: object
      properties:
        sku: { type: string }
        outlet_id: { type: string, format: uuid }
        on_hand: { type: integer }
        avg_cost_minor: { type: integer, description: Present on a receipt }

    StockRow:
      type: object
      properties:
        sku: { type: string }
        name: { type: string }
        on_hand: { type: integer }
        reserved: { type: integer }
        available: { type: integer }
        reorder_level: { type: integer }
        price_minor: { type: integer }
        avg_cost_minor: { type: integer }
        value_minor: { type: integer, description: on_hand times average cost }
        low_stock: { type: boolean, description: Present on the low-stock report }

    OrderLine:
      type: object
      properties:
        sku: { type: string }
        qty: { type: integer }
        unit_price_minor: { type: integer }
        line_total_minor: { type: integer }
        product_id: { type: string, format: uuid }
        tax_class: { type: string, enum: [standard, exempt, zero] }
        discount_minor: { type: integer, description: This line's share of the order discount }
        vat_minor: { type: integer }
        net_minor: { type: integer }
        refunded_qty: { type: integer }

    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        status: { type: string, enum: [pending_payment, paid, expired, refunded, partially_refunded, voided] }
        payment_method: { type: string, enum: [cash, transfer, wallet, split] }
        payments: { type: array, items: { $ref: "#/components/schemas/Payment" } }
        discount_reason: { type: string }
        refunded_minor: { type: integer, description: Running total refunded }
        refund: { $ref: "#/components/schemas/Refund" }
        customer_id: { type: string, format: uuid, description: Set only on a wallet sale }
        reference: { type: string, example: IKJ-A1B2C3D4-000001 }
        total_minor: { type: integer, description: Amount the customer pays, after discount }
        vat_minor: { type: integer }
        net_minor: { type: integer }
        discount_minor: { type: integer }
        cost_minor: { type: integer, description: Average cost times quantity, snapshotted at payment }
        currency: { type: string, example: NGN }
        lines:
          type: array
          items: { $ref: "#/components/schemas/OrderLine" }
        journal_id: { type: string, format: uuid, description: Absent until the sale is posted }
        expires_at: { type: string, format: date-time }
        paid_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        refund_journal_id: { type: string, format: uuid, description: Set once refunded }
        refunded_at: { type: string, format: date-time }
        refunded_by: { type: string, format: uuid }
        refund_reason: { type: string }
        refund_record_id: { type: string, format: uuid, description: Refund response for a transfer sale. The unmatched payment to settle. }

    UnmatchedPayment:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid, nullable: true }
        outlet_id: { type: string, format: uuid, nullable: true }
        provider: { type: string, example: paystack }
        event_id: { type: string, description: "Provider event id, or refund:{order id} for a refunded transfer sale" }
        amount_minor: { type: integer }
        currency: { type: string }
        reason: { type: string, enum: [order_expired, order_voided, order_already_paid, order_refunded, amount_mismatch, currency_mismatch, order_refund] }
        status: { type: string, enum: [open, applied, refund_pending, refunded] }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        resolved_by: { type: string, format: uuid, nullable: true }
        journal_id: { type: string, format: uuid, nullable: true, description: "Dr 1100 / Cr 2300 on arrival (or the order reversal for order_refund)" }
        resolution_journal_id: { type: string, format: uuid, nullable: true, description: "Sale journal (apply) or Dr 2300 / Cr 2310 (refund)" }
        settlement_journal_id: { type: string, format: uuid, nullable: true, description: "Dr 2310 / Cr 1100" }

    DailySales:
      type: object
      properties:
        date: { type: string, format: date }
        outlet_id: { type: string, format: uuid }
        order_count: { type: integer }
        total_minor: { type: integer }
        vat_minor: { type: integer }
        net_minor: { type: integer }
        by_method:
          type: array
          items:
            type: object
            properties:
              method: { type: string }
              order_count: { type: integer }
              total_minor: { type: integer }
              vat_minor: { type: integer }
              net_minor: { type: integer }
        discount_total_minor: { type: integer }
        refund_count: { type: integer }
        refunds_minor: { type: integer, description: Refunds made that day }
        net_sales_minor: { type: integer, description: total_minor minus refunds_minor }
        tender_totals:
          type: object
          properties:
            cash_minor: { type: integer }
            transfer_minor: { type: integer }
            wallet_minor: { type: integer }
        by_cashier:
          type: array
          items:
            type: object
            properties:
              staff_id: { type: string, format: uuid }
              email: { type: string }
              order_count: { type: integer }
              total_minor: { type: integer }
              discount_minor: { type: integer }
              refund_count: { type: integer }
              refunds_minor: { type: integer }
        books_debit_minor: { type: integer }
        books_refund_credit_minor: { type: integer }
        matches_books: { type: boolean }

    MerchantSettings:
      type: object
      properties:
        vat_registered: { type: boolean }
        vat_inclusive_bps: { type: integer }
        max_discount_bps_cashier: { type: integer, description: Default 1000 }
        max_discount_bps_manager: { type: integer, description: Default 3000 }

    Payment:
      type: object
      properties:
        method: { type: string, enum: [cash, wallet, transfer] }
        status: { type: string, enum: [pending, held, confirmed, returned] }
        amount_minor: { type: integer }
        refunded_minor: { type: integer }

    Refund:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        journal_id: { type: string, format: uuid }
        amount_minor: { type: integer }
        net_minor: { type: integer }
        vat_minor: { type: integer }
        cost_minor: { type: integer }
        lines: { type: array, items: { type: object, additionalProperties: true } }
        tenders: { type: object, additionalProperties: { type: integer } }
        reason: { type: string }
        staff_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    AuditEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        staff_id: { type: string, format: uuid, nullable: true }
        action: { type: string, example: order.paid }
        entity_type: { type: string }
        entity_id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid, nullable: true }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }

    Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        balance_minor: { type: integer, description: Store credit in kobo. Cannot go below zero. }
        created_at: { type: string, format: date-time }

    Account:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [asset, liability, equity, income, expense] }
        currency: { type: string, example: NGN }
        allow_negative: { type: boolean }
        status: { type: string, enum: [open, closed] }
        balance_minor: { type: integer }
        created_at: { type: string, format: date-time }

    AccountCreate:
      type: object
      required: [code, name, type]
      properties:
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [asset, liability, equity, income, expense] }
        allow_negative: { type: boolean }

    PostingInput:
      type: object
      required: [account_id, direction, amount_minor]
      properties:
        account_id: { type: string, format: uuid }
        direction: { type: string, enum: [debit, credit] }
        amount_minor: { type: integer, minimum: 1 }

    Journal:
      type: object
      properties:
        id: { type: string, format: uuid }
        description: { type: string }
        created_at: { type: string, format: date-time }
        reverses_journal_id: { type: string, format: uuid, nullable: true }
        postings:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              account_id: { type: string, format: uuid }
              direction: { type: string }
              amount_minor: { type: integer }
              currency: { type: string }
