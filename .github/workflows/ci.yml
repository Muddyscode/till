name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: till
          POSTGRES_PASSWORD: till
          POSTGRES_DB: till_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U till -d till_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TILL_TEST_DATABASE_URL: postgres://till:till@localhost:5432/till_test?sslmode=disable
      TILL_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: tests (race)
        run: go test -race ./... -count=1 -timeout 300s
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: till:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
